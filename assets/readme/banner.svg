<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Card Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#cyber-grid)" rx="16" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="80" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="320" r="160" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="380" r="100" fill="#10b981" opacity="0.1" filter="url(#glow)" />

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Top Status Badge -->
  <g transform="translate(600, 60)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="-135" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-120" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" letter-spacing="1">
      NEXT-GEN AGENT WORKBENCH · DSH
    </text>
  </g>

  <!-- Title Section -->
  <g transform="translate(600, 145)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="52" font-weight="800" fill="url(#text-glow)" letter-spacing="-0.5">
      DSH Studio
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(600, 195)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1">
      现代化 DeepSeek Harness 全栈增强工作台 · 多源 MCP 可视化调试中枢 · 视觉思考引擎 · 灵动桌宠
    </text>
  </g>

  <!-- 3 Feature Highlight Glass Cards -->
  <!-- Card 1: MCP Hub -->
  <g transform="translate(100, 245)" filter="url(#subtle-shadow)">
    <rect width="310" height="125" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="310" height="3" rx="1.5" fill="url(#accent-cyan)" />
    <!-- Icon -->
    <g transform="translate(24, 28)">
      <rect width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <path d="M 12 18 L 24 18 M 18 12 L 18 24 M 14 14 L 22 22" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="72" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">MCP 调试沙箱与中枢</text>
    <text x="72" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#38bdf8">dsh-better-sidebar-mcp</text>
    <text x="24" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">全域多源自动扫描 · 10+ 官方预设</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">Tool Tester 在线沙箱 · 毫秒级测速</text>
  </g>

  <!-- Card 2: CoT Vision -->
  <g transform="translate(445, 245)" filter="url(#subtle-shadow)">
    <rect width="310" height="125" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="310" height="3" rx="1.5" fill="url(#accent-purple)" />
    <!-- Icon -->
    <g transform="translate(24, 28)">
      <rect width="36" height="36" rx="8" fill="#9333ea" fill-opacity="0.2" stroke="#c084fc" stroke-width="1" />
      <circle cx="18" cy="18" r="7" fill="none" stroke="#c084fc" stroke-width="2" />
      <path d="M 18 11 L 18 15 M 18 21 L 18 25 M 11 18 L 15 18 M 21 18 L 25 18" stroke="#c084fc" stroke-width="1.5" />
    </g>
    <text x="72" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">视觉多模态与 CoT 穿透</text>
    <text x="72" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#c084fc">dsh-tool-describe-image</text>
    <text x="24" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">MiMo 深度思考链无损流式捕获</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">图形化连通性测速 · 模型列表探测</text>
  </g>

  <!-- Card 3: Mascot Pet -->
  <g transform="translate(790, 245)" filter="url(#subtle-shadow)">
    <rect width="310" height="125" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="310" height="3" rx="1.5" fill="url(#accent-emerald)" />
    <!-- Icon -->
    <g transform="translate(24, 28)">
      <rect width="36" height="36" rx="8" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
      <path d="M 12 24 C 12 16, 24 14, 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
      <circle cx="16" cy="17" r="1.5" fill="#34d399" />
      <circle cx="20" cy="17" r="1.5" fill="#34d399" />
    </g>
    <text x="72" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">小鲸鱼姬 2.0 灵动桌宠</text>
    <text x="72" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#34d399">dsh-mascot-pet</text>
    <text x="24" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">3套高精立绘 · 650ms 四级盲打刷题</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">零食投喂CD · 极客游戏 · 全站总账本</text>
  </g>

  <!-- Decorative Corner Accents -->
  <path d="M 16 32 L 32 16 M 16 48 L 48 16" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  <path d="M 1184 388 L 1168 404 M 1184 372 L 1152 404" stroke="#a855f7" stroke-width="1" opacity="0.4" />
</svg>
